# Site settings. Page text lives in _data/profile.yml and _data/i18n.yml;
# publications live in _publications/ and _data/pubs_extra.yml.

title       : "Xusheng Du"
description : "Xusheng Du (杜 旭升) – Junior Researcher (Assistant Professor) at Waseda University. Generative AI and human-computer interaction for 3D, architectural and urban design."
url         : https://ToKyokushou.github.io
baseurl     : ""
repository  : "ToKyokushou/ToKyokushou.github.io"
timezone    : Asia/Tokyo
encoding    : "utf-8"

markdown    : kramdown
kramdown:
  input: GFM

collections:
  publications:
    output: true
    permalink: /:collection/:path/

defaults:
  - scope:
      path: ""
      type: publications
    values:
      layout: publication

plugins:
  - jekyll-sitemap
  - jekyll-redirect-from

include:
  - _pages

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - .bundle
