  about: 早稲田大学 理工学術院総合研究所の次席研究員（研究院講師）です。2026年3月に北陸先端科学技術大学院大学で博士（情報科学）を取得し，博士後期課程優秀修了生として表彰されたのち，同年4月に着任しました。大学院進学以前は，中国の企業2社で約4年間，ソフトウェアエンジニアとしてWebシステムのフロントエンド開発に従事しました。専門は生成AIとヒューマンコンピュータインタラクション（HCI）です。スケッチなどの直感的な入力によって生成AIを制御し，3次元形状・建築・都市の設計を支援する手法と対話型システムを研究しています。研究成果は Sustainable Cities and Society，IEEE Access，Computers & Graphics，CAADRIA，HCI International などで発表しています。科研費 研究活動スタート支援（2026–2027年度）の研究代表者を務めています。
