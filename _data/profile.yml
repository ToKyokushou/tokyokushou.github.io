  about: >-
    I am a Ph.D. candidate in Information Science at the Japan Advanced Institute of
    Science and Technology (JAIST). My research lies at the intersection of computer
    graphics, generative AI and human–computer interaction: I study how hand-drawn
    sketches can drive the generation of images and 3D models, and I design and build
    interactive interfaces that keep people at the centre of the creative process.
  news:
    - date: 2025.03
      text: Two papers presented at CAADRIA 2025 in Tokyo, including our work on multi-view depth-consistent image generation for architectural design.
    - date: 2025.01
      text: Our paper "Sketch-Guided Scene Image Generation with Diffusion Model" was accepted to Computers & Graphics.
    - date: 2024.12
      text: DiffOBI was presented at ACM SIGGRAPH Asia 2024 (Technical Communications) in Tokyo.
    - date: 2024.03
      text: Received the Best Poster Award at ISID 2024.
  interests:
    - title: Sketch-based generation
      text: Image and 3D model generation from hand-drawn sketches
    - title: Interactive interfaces
      text: Interface design and development for human-centered experience
