en:
  name: Xusheng Du
  name_alt: 杜 旭升
  role: Junior Researcher (Assistant Professor)
  affiliation: Waseda Research Institute for Science and Engineering, Waseda University
  degree: Ph.D. (Information Science)
  about: I’m a Junior Researcher (Assistant Professor) at the Waseda Research Institute for Science and Engineering, Waseda University. I joined Waseda in April 2026, after receiving my Ph.D. in Information Science from the Japan Advanced Institute of Science and Technology (JAIST) in March 2026, where I was recognized as an outstanding doctoral graduate. Before graduate school, I worked for about four years as a software engineer at two companies in China, developing front ends for web systems. My research fields are generative AI and human-computer interaction (HCI). I work on methods and interactive systems that let people control generative AI through intuitive input such as sketches, supporting design from 3D shapes to architecture and cities. My work has been published in Sustainable Cities and Society, IEEE Access, Computers & Graphics, CAADRIA, and HCI International. I’m the principal investigator of a JSPS KAKENHI Grant-in-Aid for Research Activity Start-up (FY2026–2027).
  news:
  - date: '2026.11'
    text: Four papers submitted to CAADRIA 2027 are under review, including one as first author and one as corresponding author.
  - date: '2026.08'
    text: 'Gave an invited talk, “From Sketches to Cities: Controllable Generative AI for Architectural Design,” at the School of Architecture, Tianjin University (August 24).'
  - date: '2026.07'
    text: Started the JSPS KAKENHI Grant-in-Aid for Research Activity Start-up project “A Generative AI Framework for Multiscale Design Support Across Urban, Architectural, and 3D Geometric Domains” as principal investigator.
  - date: '2026.07'
    text: The CoreSearch paper (first author) was published in the proceedings of HCI International 2026, Montreal (LNCS).
  - date: '2026.06'
    text: Served as session chair at NICOGRAPH International 2026, Nagoya (Session 5, “Applied Visualization, Simulation, and XR Systems”).
  - date: '2026.06'
    text: A co-authored paper received the Honorable Mention Award at NICOGRAPH International 2026.
  - date: '2026.04'
    text: Three papers were published in the proceedings of CAADRIA 2026, Hsinchu (one as first author, one as co-first author).
  - date: '2026.04'
    text: Joined the Waseda Research Institute for Science and Engineering, Waseda University, as Assistant Professor (April 1).
  - date: '2026.03'
    text: Received a Ph.D. in Information Science from JAIST and was recognized as an outstanding doctoral graduate (March 25).
  - date: '2026.03'
    text: Our Sustainable Cities and Society paper on forecasting urban evolution with generative AI was featured in a press release by Waseda University and JAIST (March 24).
  - date: '2026.03'
    text: A co-authored Frontiers of Architectural Research paper on generating building designs from text was featured in a press release (March 31).
  - date: '2025.06'
    text: Co-organized the “AI-Driven Architectural Design and Behavioral Modeling Workshop” at NICOGRAPH International 2025, Kanazawa.
  interests_intro: 'My research lies between generative AI and human-computer interaction: <strong>making generative AI reflect what people actually intend</strong>. A consistent concern is letting users see where and how the conditions they gave show up in the result, and adjust it. In particular, I work on three themes.'
