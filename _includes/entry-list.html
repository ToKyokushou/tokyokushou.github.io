{% comment %} Dated list (education, work, awards). Param: items {% endcomment %}
<ul class="entries">
  {% for e in include.items %}
  <li class="entry">
    <span class="entry__period">{{ e.period }}</span>
    <span class="entry__body"><strong>{{ e.title }}</strong><br>{{ e.org }}</span>
  </li>
  {% endfor %}
</ul>
