{% comment %} Schematic line drawings for the research themes. Param: name (interaction | shape | city) {% endcomment %}
<svg class="art" viewBox="0 0 240 110" role="img" aria-hidden="true" focusable="false">
{% case include.name %}
{% when "interaction" %}
  <!-- a person adjusting sliders in an interface, with a live result panel -->
  <rect class="art-line art-panel" x="34" y="12" width="172" height="86" rx="7"/>
  <line class="art-line" x1="34" y1="28" x2="206" y2="28"/>
  <circle class="art-dot" cx="44" cy="20" r="2.2"/><circle class="art-dot" cx="52" cy="20" r="2.2"/><circle class="art-dot" cx="60" cy="20" r="2.2"/>
  <line class="art-track" x1="48" y1="45" x2="128" y2="45"/><line class="art-fill" x1="48" y1="45" x2="100" y2="45"/><circle class="art-knob" cx="100" cy="45" r="5"/>
  <line class="art-track" x1="48" y1="63" x2="128" y2="63"/><line class="art-fill" x1="48" y1="63" x2="72" y2="63"/><circle class="art-knob" cx="72" cy="63" r="5"/>
  <line class="art-track" x1="48" y1="81" x2="128" y2="81"/><line class="art-fill" x1="48" y1="81" x2="116" y2="81"/><circle class="art-knob" cx="116" cy="81" r="5"/>
  <rect class="art-line art-soft" x="144" y="38" width="50" height="50" rx="4"/>
  <path class="art-line" d="M152 78 l12 -16 l9 10 l6 -7 l8 13"/>
  <circle class="art-accent" cx="182" cy="50" r="4"/>
  <path class="art-cursor" d="M104 50 l0 17 l4.5 -4 l3.2 7 l3 -1.4 l-3.2 -7 l6 -0.4 z"/>
{% when "shape" %}
  <!-- a freehand sketch turned into a 3D shape -->
  <path class="art-sketch" d="M22 74 C24 52, 40 40, 58 42 C72 43, 84 52, 86 66 C87 78, 74 86, 56 86 C40 86, 24 84, 22 74 Z"/>
  <path class="art-sketch" d="M34 62 C44 54, 62 52, 74 60"/>
  <path class="art-sketch" d="M40 76 C50 80, 62 80, 70 74"/>
  <g transform="translate(74 22) rotate(40)">
    <rect class="art-line art-panel" x="0" y="0" width="7" height="26" rx="1.5"/>
    <path class="art-accent" d="M0 26 l3.5 8 l3.5 -8 z"/>
  </g>
  <line class="art-line" x1="100" y1="64" x2="126" y2="64"/><path class="art-accent" d="M126 59 l9 5 l-9 5 z"/>
  <path class="art-line art-soft" d="M184 26 l34 17 l-34 17 l-34 -17 z"/>
  <path class="art-line art-mid" d="M150 43 l34 17 l0 36 l-34 -17 z"/>
  <path class="art-line art-strong" d="M218 43 l-34 17 l0 36 l34 -17 z"/>
{% when "city" %}
  <!-- from a simple volume, to a detailed building, to a city layout -->
  <rect class="art-line art-soft" x="16" y="58" width="26" height="36"/>
  <line class="art-line" x1="50" y1="76" x2="62" y2="76"/><path class="art-accent" d="M62 72 l7 4 l-7 4 z"/>
  <path class="art-line art-soft" d="M78 94 V44 l19 -12 l19 12 V94 Z"/>
  <g class="art-accent">
    <rect x="85" y="50" width="7" height="8"/><rect x="102" y="50" width="7" height="8"/>
    <rect x="85" y="64" width="7" height="8"/><rect x="102" y="64" width="7" height="8"/>
    <rect x="93" y="80" width="8" height="14"/>
  </g>
  <line class="art-line" x1="124" y1="76" x2="136" y2="76"/><path class="art-accent" d="M136 72 l7 4 l-7 4 z"/>
  <rect class="art-line art-panel" x="152" y="20" width="74" height="74" rx="4"/>
  <line class="art-road" x1="152" y1="56" x2="226" y2="56"/><line class="art-road" x1="188" y1="20" x2="188" y2="94"/>
  <rect class="art-mid" x="158" y="26" width="12" height="10"/><rect class="art-strong" x="172" y="26" width="10" height="24"/><rect class="art-mid" x="158" y="40" width="10" height="10"/>
  <rect class="art-strong" x="194" y="26" width="26" height="10"/><rect class="art-mid" x="194" y="40" width="10" height="10"/><rect class="art-mid" x="208" y="40" width="12" height="10"/>
  <rect class="art-mid" x="158" y="62" width="24" height="12"/><rect class="art-strong" x="158" y="78" width="10" height="10"/><rect class="art-mid" x="172" y="78" width="10" height="10"/>
  <rect class="art-strong" x="194" y="62" width="12" height="26"/><rect class="art-mid" x="210" y="62" width="10" height="10"/><rect class="art-mid" x="210" y="76" width="10" height="12"/>
{% endcase %}
</svg>
